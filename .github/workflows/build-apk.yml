name: Build Release APK + AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown to users (e.g. 1.2.0). Leave empty to keep current.'
        required: false
        default: ''
      track:
        description: 'Play Store track to release to'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  build:
    name: Build — com.vasanthkumar24.onlyme
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # ── Auto version bump ──────────────────────────────────────────────────
      - name: Bump version in pubspec.yaml
        id: version
        run: |
          # Read current version name
          CURRENT=$(grep "^version:" pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)

          # Use input version name if provided, else keep current
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VNAME="${{ github.event.inputs.version_name }}"
          else
            VNAME="$CURRENT"
          fi

          # Version code = GitHub run number (always increases)
          VCODE=${{ github.run_number }}

          # Update pubspec.yaml
          sed -i "s/^version:.*/version: ${VNAME}+${VCODE}/" pubspec.yaml

          echo "version_name=$VNAME" >> $GITHUB_OUTPUT
          echo "version_code=$VCODE" >> $GITHUB_OUTPUT
          echo "full_version=${VNAME}+${VCODE}" >> $GITHUB_OUTPUT
          echo "✓ Version set to ${VNAME}+${VCODE}"

      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git diff --staged --quiet || git commit \
            -m "chore: bump version to ${{ steps.version.outputs.full_version }} [skip ci]"
          git push

      - name: Get dependencies
        run: flutter pub get

      - name: Propagate icons to platform sizes
        run: flutter pub run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # ── Signing setup ──────────────────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > android/vasanthkumar24-release.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties << PROPS
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../vasanthkumar24-release.jks
          PROPS

      # ── Build APK ──────────────────────────────────────────────────────────
      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Copy APK to releases/
        run: |
          mkdir -p releases
          V="${{ steps.version.outputs.full_version }}"
          cp build/app/outputs/apk/release/app-arm64-v8a-release.apk \
             "releases/onlyme-v${V}-arm64.apk"
          echo "APK: $(du -sh releases/onlyme-v${V}-arm64.apk)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.vasanthkumar24.onlyme-v${{ steps.version.outputs.full_version }}-apk
          path: releases/*.apk
          retention-days: 30

      # ── Build AAB (Play Store) ─────────────────────────────────────────────
      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Copy AAB to releases/
        run: |
          V="${{ steps.version.outputs.full_version }}"
          cp build/app/outputs/bundle/release/app-release.aab \
             "releases/onlyme-v${V}.aab"
          echo "AAB: $(du -sh releases/onlyme-v${V}.aab)"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.vasanthkumar24.onlyme-v${{ steps.version.outputs.full_version }}-aab
          path: releases/*.aab
          retention-days: 30

      # ── GitHub Release ─────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Only Me v${{ steps.version.outputs.version_name }}
          body: |
            ## Only Me v${{ steps.version.outputs.version_name }}
            **Version code:** ${{ steps.version.outputs.version_code }}
            **Package:** com.vasanthkumar24.onlyme

            ### Install
            - Download the APK below for direct install
            - AAB is for Play Store upload only
          files: releases/*
          make_latest: true

      # ── Google Play Deploy ─────────────────────────────────────────────────
      # Every push to main → Internal Testing (fast, auto)
      - name: Deploy to Play Store — Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.vasanthkumar24.onlyme
          releaseFiles: releases/*.aab
          track: internal
          status: completed

      # Manual trigger only → chosen track (alpha = Closed Testing, beta, production)
      - name: Deploy to Play Store — ${{ github.event.inputs.track || 'internal' }}
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.track != 'internal' && github.event.inputs.track != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.vasanthkumar24.onlyme
          releaseFiles: releases/*.aab
          track: ${{ github.event.inputs.track }}
          status: completed
          whatsNewDirectory: distribution/whatsnew
