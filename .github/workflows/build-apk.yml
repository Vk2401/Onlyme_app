name: Build Release APK

on:
  push:
    branches: [ main, master, 'claude/**' ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Regenerate icon master PNGs
        run: flutter test tool/render_icon.dart

      - name: Propagate icons to platform sizes
        run: flutter pub run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Copy APK to releases/
        run: |
          mkdir -p releases
          cp build/app/outputs/apk/release/app-arm64-v8a-release.apk releases/onlyme-v1.1.apk
          echo "APK size: $(du -sh releases/onlyme-v1.1.apk)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: onlyme-release-apk
          path: releases/onlyme-v1.1.apk
          retention-days: 30
