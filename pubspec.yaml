name: onlyme
description: Only me — a private personal tracker (tasks, finance, events, gym, snapshots).
publish_to: 'none'
version: 1.1.0+66

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  google_fonts: ^6.3.0
  lucide_icons: ^0.257.0
  intl: ^0.19.0
  url_launcher: ^6.2.5
  share_plus: ^7.2.2
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  permission_handler: ^11.3.1
  image_picker: ^1.1.2


dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
