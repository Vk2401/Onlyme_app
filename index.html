<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Only Me</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f0f;--surface:#1a1a1a;--border:#2a2a2a;--accent:#4dd9ac;--text:#f0f0f0;--muted:#888}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 24px}
.logo{width:80px;height:80px;background:var(--accent);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:24px;box-shadow:0 8px 32px rgba(77,217,172,0.25)}
h1{font-size:32px;font-weight:700;letter-spacing:-0.5px}
.tagline{color:var(--muted);margin-top:8px;font-size:16px;text-align:center;max-width:340px;line-height:1.5}
.badge{margin-top:32px;padding:8px 18px;background:rgba(77,217,172,0.1);border:1px solid rgba(77,217,172,0.25);border-radius:20px;color:var(--accent);font-size:13px;font-weight:500}
.cards{margin-top:40px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:400px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 24px;text-decoration:none;color:var(--text);display:flex;align-items:center;justify-content:space-between;transition:border-color .2s,background .2s}
.card:hover{border-color:var(--accent);background:#1f1f1f}
.card-left{display:flex;align-items:center;gap:14px}
.card-icon{font-size:22px}
.card-label{font-weight:600;font-size:15px}
.card-sub{color:var(--muted);font-size:13px;margin-top:2px}
.arrow{color:var(--muted);font-size:18px}
footer{margin-top:auto;padding-top:48px;color:var(--muted);font-size:13px;text-align:center}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="logo">&#10022;</div>
<h1>Only Me</h1>
<p class="tagline">A private, local-only personal tracker. No account. No cloud. No ads.</p>
<div class="badge">&#128274; All data stays on your device</div>
<div class="cards">
<a class="card" href="privacy-policy.html">
<div class="card-left"><span class="card-icon">&#128737;</span><div><div class="card-label">Privacy Policy</div><div class="card-sub">How your data is handled</div></div></div>
<span class="arrow">&#8250;</span>
</a>
<a class="card" href="terms-and-conditions.html">
<div class="card-left"><span class="card-icon">&#128196;</span><div><div class="card-label">Terms &amp; Conditions</div><div class="card-sub">Terms of use</div></div></div>
<span class="arrow">&#8250;</span>
</a>
</div>
<footer><p>&#169; 2026 Vip Vasanth &middot; Only Me app &middot; <a href="mailto:vipvasanth433@gmail.com">vipvasanth433@gmail.com</a></p></footer>
</body>
</html>
